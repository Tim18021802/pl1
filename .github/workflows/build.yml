name: Build Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Сборка
        run: mvn -B package --file pom.xml

      - name: Сохранение jar
        uses: actions/upload-artifact@v4
        with:
          name: TeamProTalisman
          path: target/*.jar
